<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Patiala Food Hub | Links</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
		/>
		<style>
			:root {
				--bg-color: #0f1113; /* Deep Charcoal/Black */
				--text-color: #ffffff;
				--accent-color: #f6c600;
				--card-bg: #1e2124;
				--card-hover: #2a2d32;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto,
					sans-serif;
				background-color: var(--bg-color);
				color: var(--text-color);
				display: flex;
				justify-content: center;
				min-height: 100vh;
				padding: 50px 20px;
			}

			.wrapper {
				width: 100%;
				max-width: 400px;
				text-align: center;
			}

			.logo {
				width: 100px;
				object-fit: contain;
				margin-bottom: 16px;
			}

			h1 {
				font-size: 1.5rem;
				font-weight: 700;
				margin-bottom: 30px;
				letter-spacing: -0.03em;
			}

			.links-list {
				list-style: none;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}

			.link-item {
				display: flex;
				align-items: center;
				background-color: var(--card-bg);
				color: var(--text-color);
				text-decoration: none;
				padding: 16px 20px;
				border-radius: 14px;
				font-weight: 500;
				transition: all 0.25s ease;
				border: 1px solid rgba(255, 255, 255, 0.05);
			}

			.link-item:hover {
				transform: scale(1.02);
				background-color: var(--card-hover);
				border-color: var(--accent-color);
			}

			.link-item i {
				font-size: 1.3rem;
				width: 35px;
				margin-right: 10px;
				text-align: center;
				color: #bdc3c7;
			}

			/* Hover colors for better visual feedback */
			.link-item:hover .fa-globe {
				color: var(--accent-color);
			}
			.link-item:hover .fa-facebook {
				color: #1877f2;
			}
			.link-item:hover .fa-instagram {
				color: #e4405f;
			}
			.link-item:hover .fa-tiktok {
				color: #eb24de;
			}
			.link-item:hover .fa-map-marker-alt {
				color: #ea4335;
			}

			.call-container {
				margin-top: 40px;
			}

			.call-btn {
				display: flex;
				align-items: center;
				justify-content: center;
				background-color: var(--accent-color);
				color: #000;
				text-decoration: none;
				padding: 18px;
				border-radius: 14px;
				font-weight: 700;
				font-size: 1.1rem;
				transition: all 0.3s ease;
				box-shadow: 0 8px 20px #f6c50051;
			}

			.call-btn i {
				margin-right: 12px;
			}

			.call-btn:hover {
				transform: translateY(-2px);
				filter: brightness(1.1);
				box-shadow: 0 10px 25px #f6c50066;
			}
		</style>
	</head>
